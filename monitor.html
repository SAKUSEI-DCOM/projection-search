<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1時間ごとの情報源確認｜Projection</title><style>body{background:#0b1021;color:#f5f6ff;font:16px/1.7 system-ui,sans-serif;max-width:850px;margin:auto;padding:24px}a{color:#9ed6ff}section{background:#171e35;border:1px solid #303a58;padding:20px;border-radius:16px;margin:18px 0}input{padding:12px;background:#10192b;border:1px solid #56617d;color:white;border-radius:9px;width:95%}li{margin:9px 0}.muted{color:#c0c9de}#status{white-space:pre-wrap}</style></head><body><a href="./index.html">← トップへ</a><h1>1時間ごとの情報源確認</h1><p>ライバーのXプロフィール登録状況と、実際にデータを取得できた情報源を分けて表示します。登録済みでも投稿を取得できたとは限りません。</p><section id="summary">確認結果を読み込み中…</section><section><label>ライバー名・XユーザーIDで絞り込み<input id="search" placeholder="名前または @ID"></label><p id="count" class="muted"></p><ul id="members"></ul></section><section><h2>収集方式について</h2><p>GitHub Actionsは毎時23分に起動します。公式X APIの権限がない場合、X投稿の自動収集は実行されません。許可されたRSS/Atomとリスナー提供の承認済み告知は別途処理されます。</p><p><a href="./submit.html">配信告知を情報提供する</a></p></section><script>
let all=[];const esc=s=>String(s??'');function render(){const q=document.querySelector('#search').value.trim().toLowerCase();const out=document.querySelector('#members');out.replaceChildren();const filtered=all.filter(v=>esc(v.name).toLowerCase().includes(q)||esc(v.handle).includes(q));document.querySelector('#count').textContent=filtered.length+'名表示';for(const v of filtered.slice(0,200)){const li=document.createElement('li');li.append(document.createTextNode(v.name+' — '+(v.handle?'@'+v.handle:'X URL未登録')+' ／ '+(v.registered?'監視対象ID登録済み':'ID未登録')));if(v.handle){const a=document.createElement('a');a.href='https://x.com/'+encodeURIComponent(v.handle);a.target='_blank';a.rel='noopener noreferrer';a.textContent=' Xを見る';li.append(a)}out.append(li)}}document.querySelector('#search').addEventListener('input',render);
fetch('./data/hourly_monitor_status.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(v=>{all=v.members||[];const sum=document.querySelector('#summary');sum.replaceChildren();const p=document.createElement('p');p.textContent='最終確認：'+(v.checked_at||'不明')+' ／ ライバー '+v.liver_count+'名 ／ X URL登録 '+v.profiles_with_x_url+'名 ／ 許可済みフィード取得成功 '+v.feeds_successfully_fetched+'/'+v.feed_sources_configured+'件 ／ X公式API：'+(v.official_x_api_configured?'設定あり':'未設定');sum.append(p);const n=document.createElement('p');n.className='muted';n.textContent=v.notice;sum.append(n);render()}).catch(()=>document.querySelector('#summary').textContent='確認レポートがありません。GitHub Actionsを一度実行してください。');
</script></body></html>
