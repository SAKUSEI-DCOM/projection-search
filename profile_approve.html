<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xアカウント確認登録 | Projection</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fc;color:#1b2841;max-width:850px;margin:auto;padding:20px}section{background:white;border-radius:12px;padding:18px;margin:12px 0}input{padding:9px;width:95%;margin:5px 0}button{padding:11px 16px;border:0;background:#2457a6;color:white;border-radius:8px;cursor:pointer}li{padding:8px;border-bottom:1px solid #ddd}small{color:#58687e}</style></head><body><h1>Xアカウント確認登録</h1><p>Wikiで見つかった候補を人が確認してから登録します。候補をクリックして本人のXプロフィールか確かめてください。</p><section><label>ライバー名<input id="name" placeholder="ライバー名（完全一致）"></label><label>XプロフィールURL<input id="url" placeholder="https://x.com/example"></label><button id="add">確認済みとして追加</button><p id="msg" role="status"></p></section><section><h2>確認済みリスト</h2><ul id="list"></ul><button id="download">JSONを保存</button><p><small>保存したファイルを data/verified_x_profiles.json に上書きし、GitHubにアップロードしてください。ブラウザ上の操作だけでは公開サイトは更新されません。</small></p></section><section><h2>Wikiから見つかった候補</h2><div id="candidates">読み込み中…</div></section><p><a href="automation.html">自動収集管理画面へ</a></p><script>
let roster=[],approvals=[];const $=id=>document.getElementById(id);const handle=u=>{try{const p=new URL(u);if(p.protocol!=='https:'||!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(p.hostname))return null;const m=p.pathname.match(/^\/([A-Za-z0-9_]{1,15})\/?$/);return m?m[1]:null}catch{return null}};
function draw(){const ul=$('list');ul.replaceChildren();for(const a of approvals){const li=document.createElement('li');li.textContent=a.name+' — '+a.x+' ';const b=document.createElement('button');b.textContent='削除';b.onclick=()=>{approvals=approvals.filter(v=>v!==a);draw()};li.append(b);ul.append(li)}}
$('add').onclick=()=>{const name=$('name').value.trim(),h=handle($('url').value.trim());if(!roster.some(x=>x.name===name)||!h){$('msg').textContent='名前が登録名と一致するか、URLを確認してください。';return}if(approvals.some(x=>x.name===name||handle(x.x)?.toLowerCase()===h.toLowerCase())){$('msg').textContent='同じライバーまたはアカウントが登録されています。';return}approvals.push({name,x:'https://x.com/'+h});$('msg').textContent='追加しました。JSONを保存してGitHubに反映してください。';draw()};
$('download').onclick=()=>{const blob=new Blob([JSON.stringify(approvals,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='verified_x_profiles.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
(async()=>{try{const [r,a,v]=await Promise.all([fetch('livers.json').then(x=>x.json()),fetch('data/profile_link_audit.json').then(x=>x.json()),fetch('data/verified_x_profiles.json').then(x=>x.json())]);roster=r;approvals=Array.isArray(v)?v:[];draw();const box=$('candidates');box.replaceChildren();for(const row of (a.results||[]).filter(x=>x.candidates?.length)){const p=document.createElement('p');p.textContent=row.name+'：';for(const c of row.candidates){const link=document.createElement('a');link.href=c.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=' @'+c.handle+' ';p.append(link);const b=document.createElement('button');b.textContent='入力欄にセット';b.onclick=()=>{$('name').value=row.name;$('url').value=c.url;window.scrollTo({top:0,behavior:'smooth'})};p.append(b)}box.append(p)}if(!box.childNodes.length)box.textContent='候補はまだありません。GitHub Actionsで監査を実行してください。'}catch(e){$('candidates').textContent='データを読み込めませんでした。GitHub Pagesで開いてください。'}})();
</script></body></html>
