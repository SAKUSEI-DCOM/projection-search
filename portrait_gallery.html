<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立ち絵掲載状況 | Projection</title><link rel="stylesheet" href="brand.css"><style>body{background:#fff7fb;color:#322737;font-family:system-ui,sans-serif;margin:0}main{max-width:1100px;margin:auto;padding:20px}a{color:#a32e70}.stats{padding:14px;background:white;border-radius:12px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.tile{background:white;border:1px solid #ead8e3;border-radius:14px;overflow:hidden}.photo{height:230px;display:flex;align-items:center;justify-content:center;background:#f2e8ef}.photo img{max-height:100%;max-width:100%;object-fit:contain}.info{padding:12px}.info strong{display:block;margin-bottom:7px}.info small{color:#685e68}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px}button{cursor:pointer}</style></head><body><main><h1>立ち絵掲載状況</h1><p><a href="index.html">トップページ</a> · <a href="portrait_editor.html">画像の確認・登録</a></p><p>掲載条件の確認済み画像のみ表示します。候補画像は自動掲載しません。</p><input id="q" placeholder="ライバー名で検索"><div id="stats" class="stats">読み込み中…</div><div id="grid" class="grid"></div></main><script>const $=id=>document.getElementById(id);let rows=[];function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e}function safe(u){try{return new URL(u).protocol==='https:'}catch{return false}}function render(){const q=$('q').value.toLocaleLowerCase('ja'),g=$('grid');g.replaceChildren();$('stats').textContent=`全 ${rows.length} 名 / 確認済み立ち絵 ${rows.filter(v=>v.image&&v.portrait_status==='approved').length} 名 / 未確認・未登録 ${rows.filter(v=>!(v.image&&v.portrait_status==='approved')).length} 名`;for(const v of rows.filter(v=>v.name.toLocaleLowerCase('ja').includes(q))){const card=document.createElement('article');card.className='tile';const photo=document.createElement('div');photo.className='photo';const ok=v.image&&v.portrait_status==='approved'&&safe(v.image);if(ok){const img=document.createElement('img');img.loading='lazy';img.referrerPolicy='no-referrer';img.alt=v.name+'の立ち絵';img.src=v.image;img.onerror=()=>img.replaceWith(text('span','画像を表示できません'));photo.append(img)}else photo.append(text('span','画像未確認'));const info=document.createElement('div');info.className='info';info.append(text('strong',v.name),text('small',ok?'掲載確認済み':'未掲載'));if(ok&&safe(v.portrait_source_url||v.image_source)){const a=document.createElement('a');a.href=v.portrait_source_url||v.image_source;a.target='_blank';a.rel='noopener noreferrer';a.textContent='画像の出典';info.append(document.createElement('br'),a)}card.append(photo,info);g.append(card)}}$('q').addEventListener('input',render);fetch('livers.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{rows=v;render()}).catch(()=>{$('stats').textContent='livers.json を読み込めません。GitHub PagesなどのWebサーバー上で開いてください'});</script></body></html>
