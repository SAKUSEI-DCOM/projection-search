<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立ち絵候補の審査 | Projection</title><link rel="stylesheet" href="brand.css"><style>body{margin:0;background:#fff7fb;color:#342438;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:22px}section{background:white;border:1px solid #ead6e3;border-radius:14px;padding:18px;margin:14px 0}input,select,textarea{padding:9px;border:1px solid #d9b9cb;border-radius:8px;max-width:100%;box-sizing:border-box}input[type=url]{width:100%}button{background:#a32d70;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.45}a{color:#922c65}.muted{color:#735e70}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{border:1px solid #ead6e3;border-radius:12px;padding:15px}.card img{height:220px;max-width:100%;object-fit:contain;display:block;margin:auto}.fields{display:grid;gap:8px}.tag{font-size:12px;background:#f6e9f0;padding:4px 8px;border-radius:20px}label{display:block;margin-top:8px}nav{display:flex;gap:12px;flex-wrap:wrap}small{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body><main><h1>立ち絵候補の審査 v16</h1><nav><a href="index.html">トップ</a><a href="portrait_gallery.html">掲載状況</a><a href="portrait_bulk.html">一括登録</a></nav><section><p>Wikiで発見した候補とXの立ち絵公開チャレンジを、本人・完成版・掲載許可を確認してから登録する画面です。<strong>X投稿URLだけでは画像は取得・掲載されません。</strong> 候補の採否はこの画面で編集し、JSONを保存してGitHubに反映してください。</p><p id="status">読み込み中…</p><label>候補の表示 <select id="filter"><option value="all">すべて</option><option value="unreviewed">未確認</option><option value="approved">承認済み</option><option value="rejected">却下</option></select></label><label>名前で検索 <input id="search" placeholder="ライバー名"></label><div class="actions"><button id="exportPeople">livers.jsonを書き出す</button><button id="exportCandidates">portrait_candidates.jsonを書き出す</button></div></section><div id="list" class="grid"></div></main><script>
'use strict';const $=id=>document.getElementById(id);let people=[],candidates=[];const root='data/portrait_candidates.json';
function save(name,obj){const b=new Blob([JSON.stringify(obj,null,2)+'\n'],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function validImage(v){try{const u=new URL(v);return u.protocol==='https:'&&!/(^|\.)(x\.com|twitter\.com)$/.test(u.hostname)&&!u.pathname.includes('/status/')&&/\.(png|jpg|jpeg|webp)(?:$|\?)/i.test(u.pathname+u.search)}catch{return false}}
function postLink(v){try{let u=new URL(v);return u.protocol==='https:'?u.href:null}catch{return null}}
function el(t,txt){let e=document.createElement(t);if(txt!==undefined)e.textContent=txt;return e}
function field(container,title,tag='input'){let l=el('label',title),f=el(tag);if(tag==='input')f.type='url';l.append(f);container.append(l);return f}
function render(){const filter=$('filter').value,q=$('search').value.trim().toLowerCase();$('list').replaceChildren();let shown=0;for(let c of candidates){const p=people.find(x=>x.id===c.liver_id)||people.find(x=>x.name===c.name),status=c.review_status||'unreviewed';if(filter!=='all'&&filter!==status)continue;if(q&&!String(c.name||'').toLowerCase().includes(q))continue;shown++;let card=el('article');card.className='card';card.append(el('h3',c.name||c.liver_id||'不明'),el('span',status),el('p',c.description||''));let link=postLink(c.url||c.source);if(link){let a=el('a','元投稿・候補ページを開く');a.href=link;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}let box=el('div');box.className='fields';let img=field(box,'画像の直接URL（X投稿ページURLは不可）');img.value=c.review_image_url||'';let preview=el('img');preview.alt='候補画像プレビュー';preview.hidden=!img.value;img.oninput=()=>{preview.hidden=!validImage(img.value);if(!preview.hidden)preview.src=img.value};if(!preview.hidden)preview.src=img.value;box.append(preview);let permission=el('label'),pc=el('input');pc.type='checkbox';pc.checked=!!c.permission_confirmed;permission.append(pc,document.createTextNode(' 権利者からサイト掲載許可を確認した'));box.append(permission);let complete=el('label'),cc=el('input');cc.type='checkbox';cc.checked=!!c.complete_confirmed;complete.append(cc,document.createTextNode(' 全身が公開された完成版と確認した'));box.append(complete);let identity=el('label'),ic=el('input');ic.type='checkbox';ic.checked=!!c.identity_confirmed;identity.append(ic,document.createTextNode(' 本人の立ち絵と確認した'));box.append(identity);let note=field(box,'審査メモ','textarea');note.value=c.review_note||'';let actions=el('div');actions.className='actions';let approve=el('button','確認して掲載'),reject=el('button','却下'),hold=el('button','保留');approve.onclick=()=>{if(!p)return alert('ライバーの登録先が見つかりません');if(!validImage(img.value))return alert('画像の直接HTTPS URLを入力してください');if(!(pc.checked&&cc.checked&&ic.checked))return alert('本人・完成版・掲載許可の3項目を確認してください');c.review_image_url=img.value;c.permission_confirmed=true;c.complete_confirmed=true;c.identity_confirmed=true;c.review_note=note.value;c.review_status='approved';p.image=img.value;p.portrait_source_url=c.url||c.source||'';p.portrait_status='verified';p.portrait_permission_confirmed=true;p.portrait_complete_confirmed=true;render()};reject.onclick=()=>{c.review_status='rejected';c.review_note=note.value;render()};hold.onclick=()=>{c.review_status='unreviewed';c.review_note=note.value;render()};actions.append(approve,reject,hold);box.append(actions);card.append(box);$('list').append(card)}$('status').textContent=`${people.length}名・候補${candidates.length}件／表示${shown}件。掲載承認はローカル上のみで、書き出したJSONをアップロードするまで公開されません。`}
Promise.all([fetch('livers.json').then(r=>{if(!r.ok)throw Error('livers.json');return r.json()}),fetch(root).then(r=>{if(!r.ok)throw Error(root);return r.json()})]).then(([p,c])=>{people=p;candidates=c;render()}).catch(e=>{$('status').textContent='読み込み失敗：'+e.message+'。GitHub Pages上またはローカルHTTPサーバーで開いてください。'});$('filter').onchange=render;$('search').oninput=render;$('exportPeople').onclick=()=>save('livers.json',people);$('exportCandidates').onclick=()=>save('portrait_candidates.json',candidates);
</script></body></html>
