<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立ち絵一括確認・登録 | Projection</title><link rel="stylesheet" href="brand.css"><style>body{font-family:system-ui,sans-serif;background:#fff7fb;color:#342438;margin:0}main{max-width:1050px;margin:auto;padding:20px}section{background:white;padding:18px;border-radius:14px;margin:16px 0;border:1px solid #ead6e3}button{background:#aa3376;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin:5px}input{padding:9px;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;word-break:break-all}img{width:65px;height:90px;object-fit:contain} .scroll{overflow:auto}.muted{color:#725c70}a{color:#a02d70}</style></head><body><main><h1>立ち絵一括確認・登録 v15</h1><p><a href="index.html">トップへ</a> ／ <a href="portrait_editor.html">個別編集へ</a></p><section><p>完成版の立ち絵と掲載条件を確認したデータだけを反映します。X投稿のURLは画像URLではありません。投稿画像の権利者による掲載許可を確認してください。</p><p><button id="template">CSVひな形を保存</button> <label>CSVを選択 <input id="csv" type="file" accept=".csv,text/csv"></label></p><p class="muted">列：id,name,image,portrait_source_url,permission_confirmed,complete_confirmed。確認欄は yes の場合のみ登録対象です。既存の未記入項目は保持します。</p></section><section><p id="status">読み込み中…</p><div class="scroll"><table><thead><tr><th>ライバー</th><th>画像</th><th>判定</th><th>元投稿</th></tr></thead><tbody id="results"></tbody></table></div><p><button id="export" disabled>反映済み livers.json を保存</button></p></section></main><script>
'use strict';let people=[],changed=0;
const $=id=>document.getElementById(id);
function download(name,text,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvQuote(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(quote)throw Error('CSVの引用符が閉じていません');if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows}
function validImage(s){try{let u=new URL(s);return u.protocol==='https:' && !/(^|\.)x\.com$|(^|\.)twitter\.com$/i.test(u.hostname)&& !/\/status\/\d+/.test(u.pathname)&& /\.(png|jpe?g|webp|gif)(?:$|\?)/i.test(u.pathname+u.search)}catch{return false}}
function validPost(s){try{let u=new URL(s);return u.protocol==='https:' && /(^|\.)(x\.com|twitter\.com)$/.test(u.hostname) && /\/status\/\d+/.test(u.pathname)}catch{return false}}
function show(rows){$('results').replaceChildren();for(let r of rows){let tr=document.createElement('tr');for(let v of r){let td=document.createElement('td');td.textContent=v;tr.append(td)}$('results').append(tr)}}
fetch('livers.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{people=d;$('status').textContent=`${people.length}名を読み込みました。CSVを選択してください。`}).catch(e=>{$('status').textContent='読み込み失敗：'+e.message+'。ローカルファイルではなくGitHub Pagesなどで開いてください。'});
$('template').onclick=()=>{if(!people.length)return alert('先にライバー情報を読み込んでください');let lines=['id,name,image,portrait_source_url,permission_confirmed,complete_confirmed'];for(let p of people)lines.push([p.id,p.name,'','','no','no'].map(csvQuote).join(','));download('portrait_import_template.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8')};
$('csv').onchange=async e=>{if(!people.length)return;let f=e.target.files[0];if(!f)return;let rows;try{rows=parseCSV(await f.text())}catch(err){alert(err.message);return}let head=rows.shift().map(x=>x.trim());let req=['id','name','image','portrait_source_url','permission_confirmed','complete_confirmed'];if(req.some(k=>!head.includes(k))){alert('必要な列が不足しています');return}let ids=new Map(people.map(p=>[p.id,p]));let names=new Map();for(let p of people){if(!names.has(p.name))names.set(p.name,[]);names.get(p.name).push(p)}let seen=new Set(),logs=[],ok=0;for(let r of rows){if(r.every(x=>!x.trim()))continue;let v=Object.fromEntries(head.map((k,i)=>[k,(r[i]||'').trim()]));let p=ids.get(v.id);if(!p && v.name && names.get(v.name)?.length===1)p=names.get(v.name)[0];let reason='';if(!p)reason='対象が見つからない／名前が重複';else if(seen.has(p.id))reason='CSV内で重複';else if(!v.image&&!v.portrait_source_url)reason='空欄のため変更なし';else if(v.permission_confirmed.toLowerCase()!=='yes'||v.complete_confirmed.toLowerCase()!=='yes')reason='許可・完成確認が未完了';else if(!validImage(v.image))reason='画像の直接URLではない／形式未対応';else if(!validPost(v.portrait_source_url))reason='X元投稿URLが不正';else{p.image=v.image;p.portrait_source_url=v.portrait_source_url;p.portrait_status='verified';p.portrait_permission_confirmed=true;p.portrait_complete_confirmed=true;ok++;reason='登録可能・反映済み'}if(p)seen.add(p.id);logs.push([v.name||v.id,v.image?'指定あり':'なし',reason,v.portrait_source_url||''])}changed+=ok;show(logs);$('status').textContent=`${rows.length}行を確認、今回${ok}件反映、累計${changed}件。未確認画像は反映していません。`; $('export').disabled=changed===0};
$('export').onclick=()=>download('livers.json',JSON.stringify(people,null,2)+'\n','application/json');
</script></body></html>
