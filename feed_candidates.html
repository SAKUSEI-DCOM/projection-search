<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無料フィード候補 | Projection</title><style>body{font-family:system-ui,sans-serif;background:#101b2c;color:#f0f5ff;max-width:900px;margin:auto;padding:24px}a{color:#83d6ff}.card{background:#1e3049;border-radius:12px;padding:16px;margin:12px 0}small{color:#b9c8da}.error{color:#ffb8b8}</style></head><body><h1>公開フィード候補の確認</h1><p>Wikiプロフィールから見つかったRSS・Atom・iCalendarリンクの候補です。<b>自動登録はされません。</b>情報源の許可とライバー本人との対応を確認してください。</p><p><a href="index.html">トップへ戻る</a> · <a href="automation.html">自動収集の状況</a></p><div id="status">読み込み中…</div><div id="results"></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('data/feed_discovery.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('データ未取得');return r.json()}).then(d=>{document.getElementById('status').textContent=`確認済み ${d.checked_unique||0}/${d.roster_total||'?'}名 · 候補 ${d.candidate_sources||0}件 · 更新 ${d.generated_at||'未実行'}`;let rows=(d.results||[]).filter(x=>x.sources?.length);document.getElementById('results').innerHTML=rows.length?rows.map(x=>`<section class="card"><h2>${esc(x.name)}</h2>${x.sources.map(s=>`<p>${esc(s.kind)}：<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><br><small>${esc(s.label)}</small></p>`).join('')}</section>`).join(''):'<p>候補はまだ見つかっていません。GitHub Actions実行後に更新されます。</p>'}).catch(e=>{document.getElementById('status').className='error';document.getElementById('status').textContent=e.message});</script><div style="text-align:center;padding:18px"><a href="./feed_setup.html" style="color:#9fd9ff">無料情報源の登録（v29）</a></div></body></html>
