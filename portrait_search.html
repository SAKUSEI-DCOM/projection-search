<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立ち絵確認台帳 | Projection 非公式</title><link rel="stylesheet" href="brand.css"><style>body{font-family:system-ui,sans-serif;background:#fff8fb;color:#27212a;margin:0;padding:24px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.tile{border:1px solid #ead9e2;border-radius:14px;padding:16px;background:white}a{color:#b32970}input{padding:12px;width:min(100%,500px);box-sizing:border-box}.note{color:#705b69}small{display:block;margin:8px 0}button{padding:9px;border:1px solid #aaa;border-radius:8px;background:white}</style><main><p><a href="index.html">← サイトに戻る</a></p><h1>立ち絵公開チャレンジ・確認台帳</h1><p><a href="portrait_editor.html">確認済みの立ち絵を登録・反映する（v13）</a></p><p class="note">X検索から投稿を確認できます。画像を取得・検証できていない場合は自動掲載しません。チャレンジ途中のパネル画像を完成版と誤認しないためです。</p><input id="search" placeholder="ライバー名で検索"><p id="summary"></p><div class="grid" id="cards"></div></main><script>let rows=[];const cards=document.getElementById('cards');function draw(){let q=document.getElementById('search').value.toLowerCase();cards.replaceChildren();let list=rows.filter(r=>r.name.toLowerCase().includes(q));document.getElementById('summary').textContent=list.length+'名を表示 / 画像登録 '+list.filter(r=>r.image).length+'名';for(let r of list){let el=document.createElement('article');el.className='tile';let h=document.createElement('h3');h.textContent=r.name;el.append(h);let s=document.createElement('small');s.textContent=r.image?'画像URL登録済み':'画像未検証（掲載保留）';el.append(s);for(let [label,url] of [['Xで立ち絵チャレンジを探す',r.portrait_search_url],['参考のX投稿',r.portrait_source_url],['Wikiプロフィール',r.wiki]]){if(!url)continue;let a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;el.append(a,document.createElement('br'))}cards.append(el)}}fetch('livers.json').then(r=>r.json()).then(r=>{rows=r;draw()});document.getElementById('search').addEventListener('input',draw);</script></html>
