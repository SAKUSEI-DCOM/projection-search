<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wiki立ち絵候補の確認</title><style>body{font-family:system-ui,sans-serif;max-width:950px;margin:2em auto;padding:0 1em;background:#f8f9fc;color:#182234}article{background:white;border:1px solid #ccd3df;border-radius:10px;margin:12px 0;padding:16px}a{color:#145bb8}small{color:#667}#status{padding:10px;background:#fff4d5}</style></head><body><h1>Wiki立ち絵候補の確認</h1><p>画像の利用権限が確認できるまで、候補の画像自体は表示しません。候補URLとWiki出典のみ確認できます。</p><p id="status">読み込み中</p><div id="items"></div><script>fetch('./data/wiki_portrait_candidates.json').then(r=>{if(!r.ok)throw Error('候補ファイル未生成');return r.json()}).then(data=>{let rows=Object.values(data);document.getElementById('status').textContent=rows.length+'件の画像候補（利用許可確認待ち）';let root=document.getElementById('items');for(let x of rows){let a=document.createElement('article');let h=document.createElement('h2');h.textContent=x.name; a.append(h);for(let [label,url] of [['Wikiの個人ページ',x.wiki],['画像候補のURL',x.image_url]]){let p=document.createElement('p'),link=document.createElement('a');link.textContent=label;link.href=url;link.target='_blank';link.rel='noopener noreferrer';p.append(link);a.append(p)}let small=document.createElement('small');small.textContent='掲載前に権利者の許可を確認してください';a.append(small);root.append(a)}}).catch(e=>document.getElementById('status').textContent=e.message)</script></body></html>
