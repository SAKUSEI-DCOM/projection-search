<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xプロフィール候補の確認｜Projection</title><style>body{background:#0d1426;color:#f2f6ff;font-family:system-ui,sans-serif;margin:0}main{max-width:960px;margin:auto;padding:24px}a{color:#8cd5ff}section{padding:15px;border-radius:12px;background:#1b2942;margin:14px 0}input,select{padding:12px;background:#101e33;color:white;border:1px solid #71809a;border-radius:7px;max-width:100%}.tag{background:#465577;border-radius:5px;padding:4px 8px}small{color:#c1c9d9}h1{font-size:clamp(23px,5vw,35px)}</style></head><body><main><p><a href="automation.html">← 管理画面</a></p><h1>公開WikiのXプロフィール候補</h1><p>Wikiの公開プロフィールに掲載されたXリンクを定期確認します。<strong>候補が1件でも本人のアカウントと確定したわけではありません。</strong>リンクを開いて確認してください。Xへの自動ログイン・スクレイピングは行いません。</p><p><input id="q" placeholder="名前で検索" aria-label="名前で検索"> <select id="status" aria-label="状態で絞り込み"><option value="">すべて</option><option value="single_candidate">候補1件・要確認</option><option value="ambiguous">候補複数・要確認</option><option value="not_found">候補なし</option><option value="already_registered">登録済み</option><option value="fetch_error">取得エラー</option></select></p><p id="summary">読み込み中…</p><div id="results"></div><p><small>このページでは自動登録・編集はできません。正しいアカウントは livers.json の該当ライバーの x 欄に登録してください。更新後、定期実行で監視対象へ同期されます。</small></p></main><script>let items=[];const $=id=>document.getElementById(id);function render(){const q=$('q').value.trim().toLowerCase(),s=$('status').value;const list=items.filter(x=>x.name.toLowerCase().includes(q)&&(!s||x.status===s));$('summary').textContent=`${list.length}件表示 / ${items.length}件確認済み`;const root=$('results');root.replaceChildren();for(const x of list){const sec=document.createElement('section'),h=document.createElement('h2');h.textContent=x.name;sec.append(h);const st=document.createElement('p');st.textContent='状態: '+({single_candidate:'候補1件（要確認）',ambiguous:'複数候補（要確認）',not_found:'候補なし',already_registered:'登録済み',fetch_error:'取得エラー'}[x.status]||x.status);sec.append(st);const wiki=document.createElement('a');wiki.href=x.wiki;wiki.target='_blank';wiki.rel='noopener noreferrer';wiki.textContent='Wikiプロフィールを開く';sec.append(wiki);if(x.registered_x){const p=document.createElement('p');p.textContent='登録済み: '+x.registered_x;sec.append(p)}for(const c of x.candidates||[]){const p=document.createElement('p'),a=document.createElement('a');a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='@'+c.handle;p.append(a);const small=document.createElement('small');small.textContent=' — '+(c.link_texts||[]).join(' / ');p.append(small);sec.append(p)}if(x.error){const p=document.createElement('p');p.textContent=x.error;sec.append(p)}root.append(sec)}}$('q').addEventListener('input',render);$('status').addEventListener('change',render);fetch('data/profile_link_audit.json?t='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{items=d.results||[];render()}).catch(e=>{$('summary').textContent='レポートがありません。GitHub Actionsを実行してください。 '+e.message});</script></body></html>
