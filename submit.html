<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配信告知の提供｜Projection非公式</title><style>body{font-family:system-ui,sans-serif;max-width:750px;margin:3rem auto;padding:1rem;background:#fff8fc;color:#362536}a{color:#a22d70}.panel{background:white;border:1px solid #eed5e5;border-radius:14px;padding:22px}label{display:block;margin-top:1em;font-weight:600}input,textarea{width:100%;padding:10px;box-sizing:border-box;border:1px solid #c9b6c4;border-radius:8px}button{margin-top:20px;padding:13px 20px;border:0;border-radius:8px;background:#b83778;color:white;cursor:pointer}</style></head><body><p><a href="index.html">← サイトに戻る</a></p><div class="panel"><h1>配信告知を提供する</h1><p>公開済みの投稿URLと投稿本文を、GitHub Issueとして管理者に送れます。一般の方からの提供は自動掲載されず、確認待ちになります。</p><label>元投稿URL（X）<input id="url" type="url" placeholder="https://x.com/example/status/123" required></label><label>投稿本文<textarea id="body" rows="5" placeholder="明日12時から配信します" required></textarea></label><label>投稿日時（日本時間）<input id="date" type="datetime-local" required></label><label>投稿者のX ID<input id="author" placeholder="example" required></label><button id="send">GitHubで確認・送信</button><p id="msg" role="status"></p></div><script>document.getElementById('send').onclick=()=>{const url=document.getElementById('url').value.trim(),body=document.getElementById('body').value.trim(),date=document.getElementById('date').value,author=document.getElementById('author').value.trim().replace(/^@/,'');if(!/^https:\/\/(x\.com|twitter\.com)\/[A-Za-z0-9_]{1,15}\/status\/\d+/.test(url)||!body||!date||!author){document.getElementById('msg').textContent='URL、本文、投稿日時、X IDを確認してください。';return;}const text=`### 投稿URL\n${url}\n\n### 投稿本文\n${body}\n\n### 投稿日時\n${date}+09:00\n\n### 投稿者\n${author}\n\n※ 管理者確認待ち`;const q=new URLSearchParams({title:'配信告知候補: '+author,body:text});window.open('https://github.com/SAKUSEI-DCOM/projection-search/issues/new?'+q,'_blank','noopener');};</script></body></html>
