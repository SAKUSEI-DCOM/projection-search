<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立ち絵候補確認 | Projection非公式</title><link rel="stylesheet" href="brand.css"><style>body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#faf8fa;color:#29242d}main{max-width:1050px;margin:auto}article{background:white;border:1px solid #eadfe8;border-radius:16px;padding:16px;margin:12px 0}img{max-height:240px;max-width:100%;object-fit:contain}input,select,button{padding:10px;margin:5px;border:1px solid #ccc;border-radius:8px}button{cursor:pointer}a{color:#b72e71}small{display:block;color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.grid article{margin:0}</style></head><body><main><h1>立ち絵・公開チャレンジ確認</h1><p><a href="portrait_editor.html">立ち絵の登録・反映ツールを開く（v13）</a></p><p>各ライバーのX「立ち絵公開チャレンジ」検索とWiki掲載のX投稿・画像候補を確認します。参考例：<a href="https://x.com/Orphe_watson96/status/1985127073497948355" target="_blank" rel="noopener noreferrer">オルフェ・ワトソンさんの投稿</a>（内容は自動検証していません）。<strong>チャレンジ途中の画像や、本人確認できない画像は自動掲載しません。</strong>確認済みの公開画像URLのみJSONに反映してください。</p><p><a href="./index.html">サイトへ戻る</a></p><label>名前で絞り込み <input id="q" placeholder="ライバー名"></label><p id="summary"></p><div id="cards" class="grid"></div><h2>画像登録用の操作</h2><p>各カードで画像URLを入力し「画像を仮登録」を押した後、JSONをダウンロードしてGitHubの livers.json を置き換えます。これはブラウザ内での編集であり、自動公開はされません。</p><button id="download">編集した livers.json をダウンロード</button></main><script>
let roster=[],candidates=[];const $=id=>document.getElementById(id);const safe=u=>{try{let x=new URL(u);return x.protocol==='https:'?u:''}catch{return ''}};const e=(t,s)=>{let n=document.createElement(t);if(s)n.textContent=s;return n};
function draw(){let q=$('q').value.trim().toLowerCase(),list=roster.filter(x=>x.name.toLowerCase().includes(q));$('summary').textContent=`${list.length}名 / 全${roster.length}名・立ち絵登録済み ${roster.filter(x=>x.image).length}名・未登録 ${roster.filter(x=>!x.image).length}名・Wiki候補 ${candidates.length}件`;$('cards').replaceChildren();for(let r of list){let a=e('article'),h=e('h3',r.name),p=e('p',r.generation||'');a.append(h,p);if(r.image){let im=e('img');im.src=r.image;im.alt=r.name+'の登録画像';im.loading='lazy';a.append(im)}let x=e('a','Xで立ち絵公開チャレンジを検索');x.href='https://x.com/search?q='+encodeURIComponent('from:'+((r.x||'').split('/').pop()||'')+' 立ち絵公開')+'&f=live';if(!r.x)x.href='https://x.com/search?q='+encodeURIComponent('"'+r.name+'" "立ち絵公開チャレンジ"')+'&f=live';x.target='_blank';x.rel='noopener noreferrer';a.append(x,e('br'));let w=e('a','Wiki個別ページ');w.href=r.wiki||r.source;w.target='_blank';w.rel='noopener noreferrer';a.append(w);for(let c of candidates.filter(z=>z.liver_id===r.id)){let d=e('p',(c.candidate_type==='x_reveal_post'?'X立ち絵投稿候補（未確認）: ':'Wiki画像候補（未確認）: ')+(c.description||''));let l=e('a',c.candidate_type==='x_reveal_post'?'Xの投稿を確認':'画像の出典');l.href=c.candidate_type==='x_reveal_post'?c.url:c.source;l.target='_blank';l.rel='noopener noreferrer';d.append(e('br'),l);a.append(d)}let inp=e('input');inp.type='url';inp.placeholder='確認済み画像のhttps URL';inp.value=r.image||'';inp.style.width='95%';a.append(inp);let b=e('button','画像を仮登録');b.onclick=()=>{if(inp.value&&!safe(inp.value)){alert('HTTPSの画像URLを指定してください');return}r.image=inp.value;alert('ブラウザ内で保存しました。JSONをダウンロードしてGitHubに反映してください。')};a.append(b);$('cards').append(a)}}$('q').oninput=draw;$('download').onclick=()=>{let blob=new Blob([JSON.stringify(roster,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=e('a');a.href=url;a.download='livers.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};Promise.all([fetch('./livers.json').then(r=>r.json()),fetch('./data/portrait_candidates.json').then(r=>r.ok?r.json():[]).catch(()=>[])]).then(([a,b])=>{roster=a;candidates=b;draw()}).catch(err=>$('summary').textContent='読込失敗: '+err.message);
</script></body></html>
